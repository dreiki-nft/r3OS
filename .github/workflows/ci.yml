name: ci

on:
  push:
  pull_request:

# Read-only token: CI only builds and tests.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci
      - name: Repository hygiene
        run: npm run repo:doctor
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - name: Forge build
        run: forge build --root contracts
      - name: Contract size check (Monad 128 KiB limit)
        run: node scripts/check-contract-sizes.mjs
      - name: Forge tests
        run: forge test --root contracts
      - name: Deploy script simulation
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: deploy
          DEPLOYER_ADDRESS: "0x1804c8AB1F12E6bbf3894d4083f33e07309d1f38"
          TOKEN_ZERO_RECIPIENT: "0x1804c8AB1F12E6bbf3894d4083f33e07309d1f38"
          ROYALTY_RECEIVER: "0x1804c8AB1F12E6bbf3894d4083f33e07309d1f38"
          R3TARDS_ADDRESS: "0x000000000000000000000000000000000000dEaD"
          SEASON_START: "1790000000"
          BASE_PIXELS_PER_HOUR: "512"
          PIXELS_PER_ACTIVE_DAY: "32"
          MAX_PIXELS_PER_HOUR: "2048"
          MIN_PIXELS_FOR_ACTIVE_DAY: "16"
          HOLDER_PIXELS_PER_DAY: "512"
          LAB_BASE_URI: ""
        run: forge script script/Deploy.s.sol --sender "$DEPLOYER_ADDRESS"
      - name: Web unit tests
        run: npm run test:web
      - name: Generated files must match source
        run: npm run generated:check
      - name: Frontend build
        run: npm run build
